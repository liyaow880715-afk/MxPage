name: Windows Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag to create or update a GitHub Release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare Electron icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          if (-not (Test-Path build/icon.ico)) {
            Copy-Item public/brand-icon.ico build/icon.ico
          }

      - name: Build Windows packages
        run: npm run dist:all-win

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mxpage-windows-${{ github.ref_name }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          $tag = $env:RELEASE_TAG
          $target = $env:RELEASE_TARGET
          $files = Get-ChildItem -LiteralPath dist-desktop -File |
            Where-Object { $_.Extension -in @('.exe', '.zip') } |
            ForEach-Object { $_.FullName }

          if (-not $files) {
            throw "No Windows release files were produced."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --target $target --title "MxPage $tag" --generate-notes
          }
